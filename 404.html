<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | MAXXMOTO</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --accent: #FF4500;
        }
        body.dark-theme {
            --bg: #121212;
            --text: #e0e0e0;
            --accent: #ff6d3a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 1rem;
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 600px; }
        .moto-img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
	    max-width: 400px;
        }
        h1 {
            font-size: 5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .btn-home {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: opacity 0.2s;
        }
        .btn-home:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/404.svg" alt="Страница не найдена" class="moto-img">
        <h1>404</h1>
        <p>Упс! Этот мотоцикл уже угнали, или страница уехала в закат.</p>
        <a href="/" class="btn-home">← Вернуться в каталог</a>
    </div>
    <script>
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') document.body.classList.add('dark-theme');
    </script>
</body>
</html>
